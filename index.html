<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OCRA 2FA">
  <title>OCRA 2FA</title>
  <link rel="manifest" href="manifest.webmanifest?v=4">
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; background:#f3f4f6; color:#111827; }
    .wrap { max-width:680px; margin:0 auto; padding:20px 16px 40px; }
    .header { margin-bottom:16px; }
    .card { background:#fff; border-radius:18px; padding:18px; box-shadow:0 8px 30px rgba(0,0,0,.08); margin-bottom:16px; }
    h1 { margin:0 0 6px; font-size:28px; }
    h2 { margin:0 0 8px; font-size:19px; }
    .sub { color:#6b7280; margin:0; }
    label { display:block; font-weight:600; margin:14px 0 6px; }
    input, select, button { width:100%; box-sizing:border-box; font:inherit; }
    input, select { padding:13px 12px; border:1px solid #d1d5db; border-radius:12px; background:#fff; color:#111827; font-size:16px; }
    button { border:0; border-radius:12px; padding:14px 16px; font-weight:700; font-size:16px; cursor:pointer; min-height:46px; }
    .primary { background:#111827; color:#fff; margin-top:16px; }
    .secondary { background:#e5e7eb; color:#111827; margin-top:10px; }
    .danger { background:#fee2e2; color:#991b1b; margin-top:10px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .check { display:flex; gap:10px; align-items:center; margin-top:12px; }
    .check input { width:22px; height:22px; margin:0; }
    .check label { margin:0; font-weight:500; flex:1; }
    .otp { font-size:42px; font-weight:800; letter-spacing:6px; text-align:center; padding:18px 8px; border-radius:16px; background:#f9fafb; margin-top:14px; min-height:52px; }
    .token-info { padding:12px; border-radius:12px; background:#f9fafb; margin-top:12px; line-height:1.55; }
    .ok { color:#166534; }
    .err { color:#b91c1c; }
    .small { font-size:13px; color:#6b7280; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @media (max-width:520px) { .row { grid-template-columns:1fr; } }
    @media (prefers-color-scheme: dark) {
      body { background:#111827; color:#f9fafb; }
      .card { background:#1f2937; }
      .sub,.small { color:#9ca3af; }
      input,select { background:#111827; color:#f9fafb; border-color:#4b5563; }
      .primary { background:#f9fafb; color:#111827; }
      .secondary { background:#374151; color:#f9fafb; }
      .danger { background:#451a1a; color:#fecaca; }
      .otp,.token-info { background:#111827; }
    }
  </style>
</head>
<body>
<main class="wrap">
  <div class="header">
    <h1>OCRA 2FA</h1>
    <p class="sub">Calcolo locale RFC 6287.</p>
  </div>

  <section class="card">
    <h2>1. Configurazione token</h2>

    <label for="tokenName">Nome token</label>
    <input id="tokenName" placeholder="Es. Q186" autocomplete="off">

    <label for="secret">Secret</label>
    <input id="secret" class="mono" type="password" autocomplete="off"
           autocapitalize="characters" spellcheck="false"
           placeholder="Secret Base32 o HEX">

    <div class="check">
      <input id="showSecret" type="checkbox">
      <label for="showSecret">Mostra secret</label>
    </div>

    <div class="row">
      <div>
        <label for="secretFormat">Formato secret</label>
        <select id="secretFormat">
          <option value="base32">Base32</option>
          <option value="hex">HEX</option>
        </select>
      </div>
      <div>
        <label for="digits">Cifre</label>
        <select id="digits">
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>
      </div>
    </div>

    <label for="suite">OCRA Suite</label>
    <select id="suite">
      <option value="OCRA-1:HOTP-SHA1-6:QN08">OCRA-1:HOTP-SHA1-6:QN08</option>
      <option value="OCRA-1:HOTP-SHA1-7:QN08">OCRA-1:HOTP-SHA1-7:QN08</option>
      <option value="OCRA-1:HOTP-SHA1-8:QN08">OCRA-1:HOTP-SHA1-8:QN08</option>
    </select>

    <button id="saveToken" class="primary" type="button">SALVA TOKEN</button>
    <button id="newToken" class="secondary" type="button">NUOVO TOKEN / PULISCI</button>
    <p id="saveStatus" class="small" aria-live="polite"></p>
  </section>

  <section class="card">
    <h2>2. Selezione token</h2>

    <label for="tokenSelect">Token salvato</label>
    <select id="tokenSelect">
      <option value="">— Seleziona un token —</option>
    </select>

    <div id="tokenInfo" class="token-info small">Nessun token selezionato.</div>

    <button id="deleteToken" class="danger" type="button">ELIMINA TOKEN SELEZIONATO</button>
    <p id="selectStatus" class="small" aria-live="polite"></p>
  </section>

  <section class="card">
    <h2>3. Generatore OCRA</h2>

    <p class="small">Token attivo: <b id="activeTokenName">nessuno</b></p>

    <label for="challenge">Challenge numerica (1–8 cifre)</label>
    <input id="challenge" class="mono" inputmode="numeric" maxlength="8"
           autocomplete="off" placeholder="Es. 20353285">

    <button id="generate" class="primary" type="button">GENERA OCRA</button>

    <div id="otp" class="otp mono" aria-live="polite">------</div>
    <p id="generatorStatus" class="small" aria-live="polite"></p>

    <button id="testRfc" class="secondary" type="button">TEST RFC 6287</button>
    <p class="small">Test ufficiale: challenge <span class="mono">00000000</span> → <b>237653</b>.</p>
  </section>

  <section class="card">
    <b>Nota sicurezza</b>
    <p class="small">I token vengono salvati nello storage locale della PWA su questo dispositivo.</p>
  </section>
</main>
<script src="app.js?v=4"></script>
</body>
</html>
